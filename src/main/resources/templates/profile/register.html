<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
</head>
<body>
<div th:replace="~{fragments/bodyHeader :: div}">
</div>
<main role="main">
    <div class="jumbotron shadow-sm">
      <h2 class="mb-4 text-center" th:text="'Регистрация'"></h2>
      <div class="error rounded-sm mb-3" th:if="${error}" th:text="${error}">
      </div>
      <form id="form" name="form" th:action="@{/profile/register}" method="post">
        <div class="form-group mb-3">
          <label for="name" class="form-label">Имя</label>
          <input type="text" class="form-control form-control-lg" id="name" name="name" placeholder="Имя" minlength="3">
        </div>
        <div class="form-group mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="Email">
        </div>
        <div class="form-group mb-4">
          <label for="password" class="form-label">Пароль</label>
          <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Пароль" minlength="3">
        </div>
        <div class="d-flex justify-content-center">
            <button class="btn btn-primary btn-lg" style="min-width: 200px;" name="submit" type="submit"><i class="fa fa-save"></i> Регистрация</button>
        </div>
      </form>
    </div>
</main>
</body>
</html>
