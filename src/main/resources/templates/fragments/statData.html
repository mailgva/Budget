<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<!--/*--><!--@thymesVar id="listBudgetItems" type="java.util.TreeMap"--><!--*/-->
<table class="table">
    <tbody>
    <tr th:if="${listBudgetItems.isEmpty()}">
        <td colspan="7"> Бюджет не доступен</td>
    </tr>

    <th:block th:each="element : ${listBudgetItems}">
        <tr th:id="${'d_' + #temporals.format(element.key, 'yyyy-MM-dd')}"
              th:class="${(#temporals.dayOfWeek(element.key) < 6 ? 'day table-secondary' : 'day bg-warning-light')}" onclick="hideDetail(this);" style="cursor: pointer;">
            <td colspan="7">
                <div class="d-flex justify-content-between align-items-center flex-wrap" style="color: inherit !important;">
                    <div style="flex: 1; min-width: 150px; padding: 5px 0;">
                        <h5 style="margin-bottom: 0; font-weight: bold;" th:text="${#temporals.format(element.key, 'dd-MM-yyyy') + ' - ' + #temporals.dayOfWeekName(element.key)}"> Date </h5>
                    </div>
                    <div class="d-flex justify-content-end flex-wrap align-items-center" style="flex: 2; padding: 5px 0;">
                        <div class="mx-2 my-1" style="white-space: nowrap;">
                            <h6 style="display:inline-block; color: inherit !important; font-weight: bold; margin-bottom: 0;">Приход: </h6>
                            <h5 style="display:inline-block; margin-bottom: 0;">
                                <span style="font-weight: bold; color: var(--income-color);" th:text="*{#numbers.formatDecimal(#aggregates.sum(element.value.![(kind.getType().name().equals('PROFIT') ? price : 0)]),1,'DEFAULT',0,'DEFAULT')}"></span>
                            </h5>
                        </div>
                        <div class="mx-2 my-1" style="white-space: nowrap;">
                            <h6 style="display:inline-block; color: inherit !important; font-weight: bold; margin-bottom: 0;">Расход: </h6>
                            <h5 style="display:inline-block; margin-bottom: 0;">
                                <span style="font-weight: bold; color: var(--expense-color);" th:text="*{#numbers.formatDecimal(#aggregates.sum(element.value.![(kind.getType().name().equals('PROFIT') ? 0 : price)]),1,'DEFAULT',0,'DEFAULT')}"></span>
                            </h5>
                        </div>
                        <div class="mx-2 my-1" style="white-space: nowrap;">
                            <h6 style="display:inline-block; color: inherit !important; font-weight: bold; margin-bottom: 0;">Итог: </h6>
                            <h5 style="display:inline-block; font-weight: 600; margin-bottom: 0;">
                                <span style="font-weight: 600" th:class="${#aggregates.sum(element.value.![(kind.getType().name().equals('PROFIT') ? price : -price)]) > 0  ? 'fontgreen' : (#aggregates.sum(element.value.![(kind.getType().name().equals('PROFIT') ? price : -price)]) < 0 ? 'fontred' : '')}"
                                      th:text="*{#numbers.formatDecimal(#aggregates.sum(element.value.![(kind.getType().name().equals('PROFIT') ? price : -price)]),1,'DEFAULT',0,'DEFAULT')}"></span>
                            </h5>
                        </div>
                    </div>
                </div>
            </td>
        </tr>


        <tr class="budget_detail">
            <td colspan="7" style="padding-top: 0px; padding-bottom: 12px; border-top: 0; background-color: transparent !important;">
                <table class="table table-hover" style="background-color: var(--bg-color) !important;">
                    <thead>
                    <tr class="table-active stat-detail-row">
                        <th style="width: 5%; color: var(--universal-table-text) !important;"> #</th>
                        <th style="width: 20%; color: var(--universal-table-text) !important;"> Пользователь</th>
                        <th style="width: 20%; color: var(--universal-table-text) !important;"> Вид</th>
                        <th style="width: 25%; color: var(--universal-table-text) !important;"> Описание</th>
                        <th style="width: 10%; text-align:right; color: var(--universal-table-text) !important;"> Сумма</th>
                        <th style="width: 5%"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <!--/*--><!--@thymesVar id="budgetItem" type="com.gorbatenko.budget.model.BudgetItem"--><!--*/-->
                    <th:block th:each="budgetItem,row : ${element.value}">

                        <tr th:class="${budgetItem.kind.getType().name().equals('PROFIT')  ? 'table-success' : 'table-info'}" class="stat-detail-row">
                            <td><span th:text="${row.index+1}"> # </span></td>
                            <td><span th:text="${budgetItem.user.name}"> User </span> <br>
                                <span class="subdate" th:text="${#temporals.format(budgetItem.createdAt, 'yyyy-MM-dd HH:mm')}"> </span></td>
                            <td><span th:text="${budgetItem.kind.name}"> Item </span></td>
                            <td><span th:text="${budgetItem.description}"> Description </span>
                            </td>
                            <td style="text-align:right"><span class="biggerprice" th:text="${#numbers.formatDecimal(budgetItem.price,1,'DEFAULT',0,'DEFAULT')}"> Price </span></td>
                            <td>
                                <a th:href="@{'/budget/edit/'+${budgetItem.id}}" class="btn btn-primary btn-sm" role="button"
                                   aria-pressed="true"><i
                                        class="fa fa-pencil"></i></a>
                            </td>
                        </tr>
                    </th:block>
                </table>
            </td>
        </tr>
    </th:block>
    <tbody>
</table>
