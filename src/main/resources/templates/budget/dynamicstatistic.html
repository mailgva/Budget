<html xmlns:th="http://www.thymeleaf.org" xmlns:ht="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
</head>
<body>
<div th:replace="~{fragments/bodyHeader :: div}">
</div>
<main role="main">
    <div class="jumbotron shadow-sm">
        <h4 th:text="${positionName + ': ' + #numbers.formatDecimal(positionSum,1,'DEFAULT',0,'DEFAULT')}"></h4>
        <!--/*--><!--@thymesVar id="groupPeriod" type="com.gorbatenko.budget.util.GroupPeriod"-->
        <!--*/-->
        <div class="form-group row ml-2">
            <div class="modern-radio-group">
                <div class="modern-radio-item">
                    <input type="radio" name="inlineRadioOptions" id="by_days"
                           th:checked="${groupPeriod.equals(T(com.gorbatenko.budget.util.GroupPeriod).BY_DAYS)}">
                    <label for="by_days">
                        <a style="color: inherit; text-decoration: none;"
                           th:text="${(T(com.gorbatenko.budget.util.GroupPeriod).BY_DAYS.getValue())}"
                           th:href="@{/budget/dynamicstatistic(startDate=${startDate},
                                                         endDate=${endDate},
                                                         kindId=${kindId},
                                                         type=${type},
                                                         groupPeriod=${(T(com.gorbatenko.budget.util.GroupPeriod).BY_DAYS).name()})}">
                        </a>
                    </label>
                </div>
                <div class="modern-radio-item">
                    <input type="radio" name="inlineRadioOptions" id="by_months"
                           th:checked="${groupPeriod.equals(T(com.gorbatenko.budget.util.GroupPeriod).BY_MONTHS)}">
                    <label for="by_months">
                        <a style="color: inherit; text-decoration: none;"
                           th:text="${(T(com.gorbatenko.budget.util.GroupPeriod).BY_MONTHS.getValue())}"
                           th:href="@{/budget/dynamicstatistic(startDate=${startDate},
                                                         endDate=${endDate},
                                                         kindId=${kindId},
                                                         type=${type},
                                                         groupPeriod=${(T(com.gorbatenko.budget.util.GroupPeriod).BY_MONTHS).name()})}">
                        </a>
                    </label>
                </div>
                <div class="modern-radio-item">
                    <input type="radio" name="inlineRadioOptions" id="by_years"
                           th:checked="${groupPeriod.equals(T(com.gorbatenko.budget.util.GroupPeriod).BY_YEARS)}">
                    <label for="by_years">
                        <a style="color: inherit; text-decoration: none;"
                           th:text="${(T(com.gorbatenko.budget.util.GroupPeriod).BY_YEARS.getValue())}"
                           th:href="@{/budget/dynamicstatistic(startDate=${startDate},
                                                         endDate=${endDate},
                                                         kindId=${kindId},
                                                         type=${type},
                                                         groupPeriod=${(T(com.gorbatenko.budget.util.GroupPeriod).BY_YEARS).name()})}">
                        </a>
                    </label>
                </div>
            </div>
        </div>
        <canvas id="barChart" style="max-width: 80%;max-height: 500px;"></canvas>
    </div>
    <script th:inline="javascript">
        $(document).ready(function () {
            new Chart(document.getElementById("barChart").getContext('2d'), [(${barChart})]);
        });
    </script>
</main>
</body>
</html>
